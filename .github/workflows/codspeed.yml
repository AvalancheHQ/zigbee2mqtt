name: CodeSpeed Benchmarks

on:
  push:
    branches:
      - dev
      - master
  pull_request:

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please-'))
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Install codspeed-node from Git
        run: .github/scripts/codspeed-node-from-git.sh main

      - name: Bench
        uses: CodSpeedHQ/action@v3
        with:
          run: pnpm run bench
          token: ${{ secrets.CODSPEED_TOKEN }}